openapi: 3.0.0
info:
  title: Employee Management API
  description: API documentation for Employee Management System
  version: 1.0.0
  contact:
    name: API Support
    email: support@example.com

servers:
  - url: http://localhost:3000
    description: Development server

paths:
  /employee/login:
    post:
      tags:
        - Authentication
      summary: Employee login
      description: Authenticate an employee and return access token
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - emailId
                - password
                - ipAddress
                - flag
              properties:
                emailId:
                  type: string
                  format: email
                  example: deepesh72@gmail.com
                password:
                  type: string
                  format: password
                  example: SSDS
                ipAddress:
                  type: string
                  format: ipv4
                  example: 127.0.0.1
                flag:
                  type: boolean
                  example: true
      responses:
        "200":
          description: Successful login
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
                    description: JWT access token
                  user:
                    $ref: "#/components/schemas/User"
        "400":
          description: Invalid request
        "401":
          description: Unauthorized - Invalid credentials
        "500":
          description: Internal server error

  /department/:
    post:
      tags:
        - Department
      summary: Create a new department
      description: Creates a new department with the provided details
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - code
              properties:
                name:
                  type: string
                  minLength: 3
                  maxLength: 100
                  description: The full name of the department (e.g., 'Backend Development', 'Human Resources')
                  example: "Backend Development"
                code:
                  type: string
                  minLength: 2
                  maxLength: 10
                  pattern: "^[A-Z0-9]+$"
                  description: A unique department code used for identification
                  example: "BED211"
                head:
                  type: string
                  format: uuid
                  nullable: true
                  description: Employee ID of the department head
                  example: null
                under:
                  type: string
                  format: uuid
                  nullable: true
                  description: ID of the parent department
                  example: null
                headUser:
                  type: boolean
                  description: Whether the department head is a user
                  example: true
      responses:
        "201":
          description: Department created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Department created successfully"
                  data:
                    $ref: "#/components/schemas/Department"
        "400":
          description: Bad Request - Invalid input data or missing required fields
        "401":
          description: Unauthorized - Missing or invalid authentication token
        "409":
          description: Conflict - Department with the same name or code already exists
        "500":
          description: Internal Server Error - An unexpected error occurred

    get:
      tags:
        - Department
      summary: Get list of departments with pagination
      description: Returns a paginated list of departments
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: size
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 10
          description: Number of items per page (1-100)
        - in: query
          name: page
          schema:
            type: integer
            minimum: 1
            default: 1
          description: Page number
      responses:
        "200":
          description: A paginated list of departments
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Departments retrieved successfully"
                  data:
                    type: object
                    properties:
                      items:
                        type: array
                        items:
                          $ref: "#/components/schemas/Department"
                      total:
                        type: integer
                        example: 5
                      page:
                        type: integer
                        example: 1
                      pages:
                        type: integer
                        example: 1
        "401":
          description: Unauthorized - Invalid or missing authentication token
        "500":
          description: Internal Server Error - An unexpected error occurred

  /department/{departmentId}:
    parameters:
      - in: path
        name: departmentId
        required: true
        schema:
          type: string
          format: uuid
        description: Unique identifier of the department
        example: "903bd690-61f3-43db-9edd-d38d531c1c67"

    put:
      tags:
        - Department
      summary: Update a department
      description: Updates an existing department with the provided details
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              properties:
                name:
                  type: string
                  minLength: 3
                  maxLength: 100
                  description: The updated name of the department
                  example: "Management"
                code:
                  type: string
                  minLength: 2
                  maxLength: 15
                  pattern: "^[A-Z0-9]+$"
                  description: Updated department code
                  example: "MANAGEMENT1111"
                head:
                  type: string
                  format: uuid
                  nullable: true
                  description: Employee ID of the new department head
                  example: "903bd690-61f3-43db-9edd-d38d531c1c67"
                under:
                  type: string
                  format: uuid
                  nullable: true
                  description: ID of the parent department
                  example: null
                inside:
                  type: string
                  format: uuid
                  nullable: true
                  description: ID of the department this department should be moved inside
                  example: null
                headUser:
                  type: boolean
                  description: Whether the department head is a user
                  example: true
      responses:
        "200":
          description: Department updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Department updated successfully"
                  data:
                    $ref: "#/components/schemas/Department"
        "400":
          description: Bad Request - Invalid input data or no fields to update
        "401":
          description: Unauthorized - Missing or invalid authentication token
        "403":
          description: Forbidden - User doesn't have permission to update this department
        "404":
          description: Not Found - Department with the specified ID doesn't exist
        "409":
          description: Conflict - Department with the same name or code already exists
        "500":
          description: Internal Server Error - An unexpected error occurred

  /job/createSkills/{employeeId}:
    parameters:
      - in: path
        name: employeeId
        required: true
        schema:
          type: string
          format: uuid
        description: ID of the employee to add skills for
        example: "eb6df26e-e0d3-4d10-8714-873fef6e213c"

    post:
      tags:
        - Skills
      summary: Add new skills for an employee
      description: Creates multiple skills for a specific employee
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - skillsData
              properties:
                skillsData:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    required:
                      - skillName
                      - category
                      - proficiency
                      - employeeMainId
                    properties:
                      skillName:
                        type: string
                        minLength: 2
                        maxLength: 100
                        description: Name of the skill
                        example: "JavaScript"
                      category:
                        type: string
                        enum: ["TECHNICAL", "SOFTSKILL", "LANGUAGE", "OTHER"]
                        description: Category of the skill
                        example: "TECHNICAL"
                      proficiency:
                        type: string
                        enum: ["BEGINNER", "INTERMEDIATE", "ADVANCED", "EXPERT"]
                        description: Proficiency level in the skill
                        example: "ADVANCED"
                      employeeMainId:
                        type: string
                        format: uuid
                        description: ID of the employee this skill belongs to
                        example: "eb6df26e-e0d3-4d10-8714-873fef6e213c"
      responses:
        "201":
          description: Skills created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Skills added successfully"
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Skill"
        "400":
          description: Bad Request - Invalid input data
        "401":
          description: Unauthorized - Missing or invalid authentication token
        "500":
          description: Internal Server Error - An unexpected error occurred

  /job/getAllRequisition/{userId}:
    get:
      tags:
        - Job Requisition
      summary: Get paginated list of job requisitions
      description: Retrieves a paginated list of job requisitions with optional filtering
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: userId
          required: true
          schema:
            type: string
            format: uuid
          description: ID of the user retrieving the requisitions
          example: "eb6df26e-e0d3-4d10-8714-873fef6e213c"
        - in: query
          name: size
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 10
          description: Number of items per page (1-100)
        - in: query
          name: page
          schema:
            type: integer
            minimum: 1
            default: 1
          description: Page number
        - in: query
          name: status
          schema:
            type: string
            enum:
              [
                "DRAFT",
                "PENDING_APPROVAL",
                "APPROVED",
                "REJECTED",
                "JOB_CONVERTED",
                "CLOSED",
              ]
          description: Filter by requisition status
          required: false
        - in: query
          name: departmentId
          schema:
            type: string
            format: uuid
          description: Filter by department ID
          required: false
      responses:
        "200":
          description: List of job requisitions retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  status:
                    type: integer
                    example: 200
                  message:
                    type: string
                    example: "Requisition retrieved successfully"
                  data:
                    type: object
                    properties:
                      totalrows:
                        type: integer
                        example: 65
                      pageData:
                        type: array
                        items:
                          $ref: "#/components/schemas/JobRequisitionDetails"
                      totalPages:
                        type: integer
                        example: 7
                      currentPage:
                        type: integer
                        example: 1
        "400":
          description: Bad Request - Invalid query parameters
        "401":
          description: Unauthorized - Missing or invalid authentication token
        "500":
          description: Internal Server Error - An unexpected error occurred

  /job/createRequisition/{userId}:
    parameters:
      - in: path
        name: userId
        required: true
        schema:
          type: string
          format: uuid
        description: ID of the user creating the job requisition
        example: "eb6df26e-e0d3-4d10-8714-873fef6e213c"

    post:
      tags:
        - Job Requisition
      summary: Create a new job requisition
      description: Creates a new job requisition with the provided details
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - jobData
              properties:
                jobData:
                  type: object
                  required:
                    - title
                    - type
                    - jobMode
                    - location
                    - description
                    - experience
                    - education
                    - salary
                    - minSalary
                    - maxSalary
                    - validTill
                    - position
                    - minthreshold
                    - matchthreshold
                  properties:
                    title:
                      type: string
                      minLength: 3
                      maxLength: 100
                      description: Job title
                      example: "Software Engineer"
                    type:
                      type: string
                      enum:
                        [
                          "Full-time",
                          "Part-time",
                          "Contract",
                          "Temporary",
                          "Internship",
                        ]
                      description: Type of employment
                      example: "Full-time"
                    jobMode:
                      type: string
                      enum: ["WorkFromOffice", "Remote", "Hybrid"]
                      description: Work mode for the job
                      example: "WorkFromOffice"
                    location:
                      type: string
                      description: Job location
                      example: "Pune"
                    shifts:
                      type: string
                      description: Work shifts
                      example: "Morning"
                      nullable: true
                    description:
                      type: string
                      description: Detailed job description
                      example: "We need an experienced developer"
                    experience:
                      type: string
                      description: Required experience level
                      example: "3-5 years"
                    education:
                      type: string
                      description: Required education level
                      example: "B.Tech"
                    salary:
                      type: string
                      description: Salary range
                      example: "6-8 LPA"
                    minSalary:
                      type: number
                      minimum: 0
                      description: Minimum salary in currency units
                      example: 600000
                    maxSalary:
                      type: number
                      minimum: 0
                      description: Maximum salary in currency units
                      example: 800000
                    validTill:
                      type: string
                      format: date
                      description: Last date to apply (YYYY-MM-DD)
                      example: "2025-12-31"
                    position:
                      type: string
                      description: Job position/role
                      example: "Backend Developer"
                    minthreshold:
                      type: number
                      minimum: 0
                      maximum: 100
                      description: Minimum threshold for candidate matching (%)
                      example: 70
                    matchthreshold:
                      type: number
                      minimum: 0
                      maximum: 100
                      description: Desired threshold for candidate matching (%)
                      example: 85
                    designationId:
                      type: string
                      format: uuid
                      description: ID of the job designation
                      example: "844f938b-cf34-4c02-836b-b9a852e0ccde"
                      nullable: true
                    recuiterId:
                      type: string
                      format: uuid
                      description: ID of the recruiter
                      example: "eb6df26e-e0d3-4d10-8714-873fef6e213c"
                      nullable: true
                    departmentId:
                      type: string
                      format: uuid
                      description: ID of the department
                      example: "bd9c3041-bcf5-42e1-9d03-f0af6ba6efb3"
                      nullable: true
                    shiftId:
                      type: string
                      format: uuid
                      description: ID of the work shift
                      example: "1517abcf-2722-4ebf-990f-8596afbb62cf"
                      nullable: true
                    jobDescription:
                      type: string
                      description: Detailed job description
                      example: "Detailed job responsibilities and requirements"
                      nullable: true
                    requirements:
                      type: string
                      description: Job requirements
                      example: "Required skills and qualifications"
                      nullable: true
                    responsibilities:
                      type: string
                      description: Job responsibilities
                      example: "Key responsibilities for the role"
                      nullable: true
                    managerId:
                      type: string
                      format: uuid
                      description: ID of the hiring manager
                      example: "eb6df26e-e0d3-4d10-8714-873fef6e213c"
                      nullable: true
                approvers:
                  type: object
                  properties:
                    managerId:
                      type: string
                      format: uuid
                      description: ID of the approving manager
                      example: "25b2a02a-7f16-4a93-a897-5d71a3842bf0"
                  nullable: true
                skills:
                  type: array
                  description: List of skill IDs required for the job
                  items:
                    type: string
                    example: "1"
                  minItems: 1
                benefits:
                  type: array
                  description: List of benefit IDs offered with the job
                  items:
                    type: string
                    format: uuid
                    example: "092941a2-89ee-4af3-867f-144bb5877228"
                  minItems: 1
      responses:
        "201":
          description: Job requisition created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Job requisition created successfully"
                  data:
                    $ref: "#/components/schemas/JobRequisition"
        "400":
          description: Bad Request - Invalid input data or missing required fields
        "401":
          description: Unauthorized - Missing or invalid authentication token
        "403":
          description: Forbidden - User doesn't have permission to create job requisitions
        "500":
          description: Internal Server Error - An unexpected error occurred

  /job/getRequisitionById/{id}:
    get:
      tags:
        - Job Requisition
      summary: Get job requisition by ID
      description: Retrieves detailed information about a specific job requisition
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
          description: ID of the job requisition to retrieve
          example: "5e26c610-3de8-4897-8e7a-a2599a6e7f51"
      responses:
        "200":
          description: Job requisition retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  status:
                    type: integer
                    example: 200
                  message:
                    type: string
                    example: "Requisition retrieved successfully"
                  data:
                    $ref: "#/components/schemas/JobRequisitionDetails"
        "400":
          description: Bad Request - Invalid ID format
        "401":
          description: Unauthorized - Missing or invalid authentication token
        "404":
          description: Not Found - Job requisition not found
        "500":
          description: Internal Server Error - An unexpected error occurred

  /job/getAllSkills/{userId}:
    get:
      tags:
        - Skills
      summary: Get paginated list of skills
      description: Retrieves a paginated list of skills for a user
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: userId
          required: true
          schema:
            type: string
            format: uuid
          description: ID of the user to get skills for
          example: "eb6df26e-e0d3-4d10-8714-873fef6e213c"
        - in: query
          name: size
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 10
          description: Number of items per page (1-100)
        - in: query
          name: page
          schema:
            type: integer
            minimum: 1
            default: 1
          description: Page number
      responses:
        "200":
          description: List of skills retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  status:
                    type: integer
                    example: 200
                  data:
                    type: object
                    properties:
                      totalrows:
                        type: integer
                        example: 43
                      pageData:
                        type: array
                        items:
                          $ref: "#/components/schemas/Skill"
                      totalPages:
                        type: integer
                        example: 5
                      currentPage:
                        type: integer
                        example: 1
        "401":
          description: Unauthorized - Missing or invalid authentication token
        "500":
          description: Internal Server Error - An unexpected error occurred

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: "5021d22c-b5bd-4132-b761-d3b6007f62f8"
        firstName:
          type: string
          example: "John"
        email:
          type: string
          format: email
          example: "john.doe@example.com"
        role:
          type: string
          example: "EMPLOYEE"

    Department:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: "603f650a-7b1e-4865-9e3a-1e8f5e3d7a5c"
        name:
          type: string
          example: "Engineering"
        description:
          type: string
          example: "Software development and engineering department"
        managerId:
          type: string
          format: uuid
          example: "5021d22c-b5bd-4132-b761-d3b6007f62f8"
        status:
          type: string
          enum: ["ACTIVE", "INACTIVE"]
          example: "ACTIVE"
        createdAt:
          type: string
          format: date-time
          example: "2025-01-01T00:00:00Z"
        updatedAt:
          type: string
          format: date-time
          example: "2025-01-01T00:00:00Z"

    Skill:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: "5f62c8a9-0c44-4b6e-9342-9703ef07c5c5"
        skillName:
          type: string
          example: "JavaScript"
        category:
          type: string
          enum: ["TECHNICAL", "SOFTSKILL", "LANGUAGE", "OTHER"]
          example: "TECHNICAL"
        proficiency:
          type: string
          enum: ["BEGINNER", "INTERMEDIATE", "ADVANCED", "EXPERT"]
          example: "ADVANCED"
        isActive:
          type: boolean
          example: true
        createdAt:
          type: string
          format: date-time
          example: "2025-06-30T09:20:18.000Z"
        updatedAt:
          type: string
          format: date-time
          example: "2025-06-30T09:20:18.000Z"
        officeId:
          type: string
          format: uuid
          example: "8e2f4467-dff5-4717-932f-bcbc9431f5dc"
        organizationId:
          type: string
          format: uuid
          example: "891bb2ae-588c-4518-953e-1e367e3a23df"
        employeeMainId:
          type: string
          format: uuid
          nullable: true
          example: "eb6df26e-e0d3-4d10-8714-873fef6e213c"

    JobRequisitionDetails:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: "5e26c610-3de8-4897-8e7a-a2599a6e7f51"
        status:
          type: string
          enum:
            [
              "DRAFT",
              "PENDING_APPROVAL",
              "APPROVED",
              "REJECTED",
              "JOB_CONVERTED",
              "CLOSED",
            ]
          example: "JOB_CONVERTED"
        title:
          type: string
          example: "IT Operations Analyst"
        code:
          type: string
          nullable: true
          example: null
        companyName:
          type: string
          nullable: true
          example: null
        type:
          type: string
          example: "Full-time"
        jobMode:
          type: string
          example: "WorkFromHome"
        location:
          type: string
          example: "Pune"
        shifts:
          type: string
          example: "Full Day Shift"
          nullable: true
        description:
          type: string
          nullable: true
          example: "Job description here"
        benefits:
          type: array
          items:
            type: string
          nullable: true
        experience:
          type: string
          nullable: true
          example: "3-5 years"
        education:
          type: string
          nullable: true
          example: "B.Tech"
        duration:
          type: string
          nullable: true
        related:
          type: string
          nullable: true
        salary:
          type: string
          nullable: true
          example: "30000-40000"
        minSalary:
          type: number
          example: 30000
        maxSalary:
          type: number
          example: 40000
        validTill:
          type: string
          format: date
          nullable: true
        isActive:
          type: boolean
          example: true
        position:
          type: string
          example: "3"
        minthreshold:
          type: number
          nullable: true
          example: 70
        matchthreshold:
          type: number
          nullable: true
          example: 80
        jobDescription:
          type: string
          nullable: true
          example: "Detailed job description here"
        responsibilities:
          type: string
          nullable: true
          example: "List of responsibilities"
        requirements:
          type: string
          nullable: true
          example: "List of requirements"
        workflow_status:
          type: string
          example: "COMPLETED"
        createdAt:
          type: string
          format: date-time
          example: "2025-07-01T08:51:51.000Z"
        updatedAt:
          type: string
          format: date-time
          example: "2025-07-01T09:03:44.000Z"
        departmentId:
          type: string
          format: uuid
          example: "125673a1-90c1-4d2f-870a-941c5031e6b7"
        designationId:
          type: string
          format: uuid
          example: "3837a1f2-0dec-4f75-8c47-a8e6d1f0b4ed"
        employeeMainId:
          type: string
          format: uuid
          example: "3bfa2da7-2932-4860-bf7c-30488eab49b6"
        recuiterId:
          type: string
          format: uuid
          example: "2d945306-f2bf-4de7-84d4-6c403559c51e"
        managerId:
          type: string
          format: uuid
          example: "5bcb9892-6217-4563-a3b3-97d9fdd0e44b"
        organizationId:
          type: string
          format: uuid
          example: "891bb2ae-588c-4518-953e-1e367e3a23df"
        officeId:
          type: string
          format: uuid
