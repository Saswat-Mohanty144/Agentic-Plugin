[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hrms-agentic-plugin"
version = "1.0.0"
description = "Standalone, host-agnostic intelligence microservice that makes any HRMS agentic with dynamic schema adaptation."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
    { name = "Saswat Mohanty", email = "saswat.mohanty@iceipts.com" }
]
dependencies = [
    "pydantic>=2.5.0",
    "pyyaml>=6.0.1",
    "httpx>=0.25.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.3.0",
    "mypy>=1.8.0",
]

[tool.hatch.build.targets.wheel]
packages = ["hrms_plugin"]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-q --import-mode=importlib"
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = []
