apiVersion: apps/v1
kind: Deployment
metadata:
  name: hrms-agentic-plugin
  labels:
    app.kubernetes.io/name: hrms-agentic-plugin
    app.kubernetes.io/component: intelligence-sidecar
spec:
  # SQLite is single-writer; scaling out needs a shared store (hosting topology is an owner decision).
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: hrms-agentic-plugin
  template:
    metadata:
      labels:
        app: hrms-agentic-plugin
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
        - name: plugin-api
          image: ghcr.io/your-org/hrms-agentic-plugin:1.0.0
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          ports:
            - containerPort: 8000
              name: http
          envFrom:
            - secretRef:
                name: hrms-plugin-secrets
                optional: true
          env:
            - name: PORT
              value: "8000"
            - name: HRMS_TENANT_REGISTRY
              value: /etc/hrms/tenants.yaml
            - name: HRMS_DATA_DIR
              value: /var/lib/hrms
          volumeMounts:
            - name: tenant-registry
              mountPath: /etc/hrms
              readOnly: true
            - name: hrms-data
              mountPath: /var/lib/hrms
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 20
      # Tenant issuer registry (spec §6.1). Create ConfigMap hrms-plugin-tenant-registry with key tenants.yaml.
      volumes:
        - name: tenant-registry
          configMap:
            name: hrms-plugin-tenant-registry
            items:
              - key: tenants.yaml
                path: tenants.yaml
        - name: hrms-data
          persistentVolumeClaim:
            claimName: hrms-data
        - name: tmp
          emptyDir: {}
