version: '3.8'

services:
  hrms-plugin-api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    container_name: hrms-agentic-plugin-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - ENVIRONMENT=production
      - LOG_LEVEL=INFO
      - DEFAULT_JURISDICTION=UAE
      - HOST_HRMS_BASE_URL=http://host.docker.internal:5000
      - HRMS_TENANT_REGISTRY=/etc/hrms/tenants.yaml
    volumes:
      # Tenant issuer registry (spec §6.1). Required: compose refuses to start if the host path is not given.
      - ${HRMS_TENANT_REGISTRY_FILE:?set HRMS_TENANT_REGISTRY_FILE to your tenant registry YAML}:/etc/hrms/tenants.yaml:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s

  hrms-sdk-static:
    image: nginx:alpine
    container_name: hrms-agentic-plugin-sdk
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ../sdk:/usr/share/nginx/html:ro
    depends_on:
      - hrms-plugin-api
