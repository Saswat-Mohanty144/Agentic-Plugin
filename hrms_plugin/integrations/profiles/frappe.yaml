# Frappe HRMS. Source: frappe/hrms@develop hrms/hr/doctype/job_requisition/job_requisition.json (checked 2026-10-29);
# REST: /api/resource/:doctype, explicit `fields`, offset paging, rows under `data`.
protocol: rest
vendor: frappe
auth: frappe_token
entities:
  REQUISITION:
    path: /api/resource/Job Requisition
    request_fields: true
    items_at: data
    pagination: {kind: offset, start_param: limit_start, size_param: limit_page_length, size: 100}
    id_from: name
    fields:
      title: {from: designation}
      department: {from: department}
      headcount: {from: no_of_positions, type: int}
      status:
        from: status
        map: {"Pending": PENDING, "Open & Approved": OPEN, "Rejected": REJECTED, "Filled": FILLED,
              "On Hold": ON_HOLD, "Cancelled": CANCELLED}
      description: {from: description}
      hiring_manager_ref: {from: requested_by}
